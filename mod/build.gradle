// NPC Baritone — Forge 1.12.2 knjižnica (D-007: okolje enako CustomNPC rework).
//
// Izvorne mape:
//   src/main/java      si.ladja.npcbaritone.core (port Baritona, LGPL) + forge
//                      (nespremenjen uvoz je commit 3a4ea58, relokacija d99d792 — D-026)
//   src/test/java      headless JUnit: harness, golden testi, lint (D-022)
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'idea'

version = '0.0.1-m0'
group = 'si.ladja.npcbaritone'
archivesBaseName = 'npcbaritone'
sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.12.2-14.23.5.2847'
    mappings = 'snapshot_20171003'
    runDir = 'run'
    makeObfSourceJar = false
    replace '@VERSION@', project.version
    replaceIn 'NpcBaritoneMod.java'
}

repositories {
    mavenCentral()
}

dependencies {
    testCompile 'junit:junit:4.13.2'
    testCompile 'org.hamcrest:hamcrest-core:1.3'
}

tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// D-004: licenca in izvor gresta v vsak jar.
jar {
    from(rootProject.file('../LICENSE')) { into 'META-INF' }
    from(rootProject.file('../NOTICE.md')) { into 'META-INF' }
}

test {
    // Navaden JUnit brez FML transformerja: mapirane odvisnosti neposredno (kot CNPC).
    classpath = sourceSets.test.output + sourceSets.main.output + sourceSets.test.compileClasspath
    systemProperty 'npcb.reportDir', "$buildDir/reports/npcb"
    maxHeapSize = '1G'
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
}

// FG 2.3 ima zastarel HTTP naslov za assets; prepare-assets.ps1 jih prenese prek HTTPS.
afterEvaluate { tasks.getByName('getAssets').enabled = false }

afterEvaluate {
    ['runClient', 'runServer'].each { taskName ->
        def t = tasks.getByName(taskName)
        t.maxHeapSize = '2G'
        // Zagon je akcija, ne gradnja izhoda (CNPC M0.6: sicer UP-TO-DATE in se ne zažene).
        t.outputs.upToDateWhen { false }
    }
    // Konzola dev strežnika bere stdin (skriptiran smoke, ukaz 'stop'); samo z --no-daemon.
    tasks.getByName('runServer').standardInput = System.in
    // Brez okna s statistiko (CNPC M2.6: StatsComponent kliče System.gc() 2x/s).
    tasks.getByName('runServer').args 'nogui'
}

// Dedicated strežnik LWJGL natives ne rabi. extractNatives pa na Windowsu pade ("Could not
// expand ZIP"), ko ima jar v Gradle cache odprt drug Gradle proces (npr. daemon iz
// '.\dev.ps1 build'). Kadar graf vsebuje runServer brez runClient, se korak preskoči.
gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':runServer') && !graph.hasTask(':runClient')) {
        tasks.getByName('extractNatives').enabled = false
    }
}

// M6.8: API jar za porabnike (compileOnly), deobf (MCP imena), različica API 1.
// Vzorci morajo biti enaki kot ApiJarTest.API_JAR_INCLUDES (test preveri, da se porabnik prevede).
task apiJar(type: Jar, dependsOn: classes) {
    classifier = 'api'
    def apiIncludes = ['si/ladja/npcbaritone/api/**',
                       'si/ladja/npcbaritone/core/api/pathing/goals/**',
                       'si/ladja/npcbaritone/core/api/utils/BetterBlockPos*',
                       'si/ladja/npcbaritone/core/api/utils/interfaces/IGoalRenderPos*',
                       'si/ladja/npcbaritone/core/api/pathing/movement/ActionCosts*']
    from(sourceSets.main.output) { include apiIncludes }
    from(sourceSets.main.allJava) { include apiIncludes }
    from(rootProject.file('../LICENSE')) { into 'META-INF' }
    from(rootProject.file('../NOTICE.md')) { into 'META-INF' }
    manifest { attributes('NpcBaritone-Api-Version': '3') } // D-039, D-030 (worker)
}
build.dependsOn apiJar

// Compile classpath za oblačno prevajanje in IDE.
task workspacePaths {
    doLast {
        file("$buildDir/workspace-classpath.txt").text = sourceSets.test.compileClasspath.asPath
        println "Classpath written to $buildDir/workspace-classpath.txt"
    }
}
